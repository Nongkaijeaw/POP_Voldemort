<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pop Voldemort</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <h1>Dark Arts Login</h1>
        
        <div id="login-form">
            <input type="text" id="login-user" placeholder="Username" required>
            <input type="password" id="login-pass" placeholder="Password" required>
            <button id="loginBtn">เข้าสู่ระบบ (Login)</button>
            
            <p class="switch-text">
                ยังไม่มีบัญชี? <span id="to-register">สมัครสมาชิกที่นี่</span>
            </p>
        </div>

        <div id="register-form" class="hidden">
            <input type="text" id="reg-user" placeholder="New Username" required>
            <input type="password" id="reg-pass" placeholder="New Password" required>
            <button id="regBtn" class="secondary">สมัครสมาชิก (Register)</button>
            
            <p class="switch-text">
                มีบัญชีแล้ว? <span id="to-login">กลับไปหน้า Login</span>
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
